name: release

on:
  push:
    tags: ["v*"]

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  docker:
    name: verify tag, build and push image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate evidence-only attestation, protected-main provenance and monotonic versions
        run: sh deploy/scripts/verify-release.sh "${GITHUB_REF_NAME#v}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the already-gated commit
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
