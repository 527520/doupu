name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    # 即使仓库长期无提交，也每周重跑 PostgreSQL 16 备份→恢复→canary 演练。
    - cron: "17 3 * * 1"

jobs:
  static:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 / undici 8 要求 Node >= 22（node 20 下 webidl.util.markAsUncloneable 缺失，
          # jsdom 测试 worker 无法启动）；生产镜像仍为 node:20-alpine，不受影响
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  coverage:
    name: unit coverage
    runs-on: ubuntu-latest
    # 5× 全量（含 integration）约 17 分钟 + npm ci，20 分钟余量太小，慢 runner 会误超时。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests + coverage（连续 5 次，不含 integration / performance）
        run: npm run test:coverage:stable

  windows-unit:
    # 本仓库在 Windows 上开发，而 releaseSafety 等门禁曾因 POSIX 依赖只在 Linux 绿灯。
    # 这个 job 保证「开发机能跑的测试」不再漂移（依赖 sh 的用例在此自动跳过）。
    name: unit tests (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and serial tests on Windows
        run: npm run test:unit

  integration:
    name: database / API integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: PGlite database and route integration
        run: npm run test:integration

  performance:
    name: performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Uninstrumented serial performance tests（连续 5 次）
        run: npm run test:performance:stable

  e2e:
    name: E2E（chromium / firefox / webkit）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [static, coverage, integration, performance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify Playwright browsers
        run: npm run test:e2e:check
      - name: Run E2E without retries（连续 3 次）
        run: npm run test:e2e:stable
      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release-safety:
    name: audit / standalone / PostgreSQL / backup restore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: doupu
          POSTGRES_USER: doupu
          POSTGRES_PASSWORD: doupu-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doupu -d doupu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for production-browser smoke
        run: npx playwright install --with-deps chromium
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Build standalone and backup images
        run: |
          docker build -t doupu-app:local .
          docker compose -f docker-compose.prod.yml build backup
        env:
          APP_IMAGE: doupu-app:local
          APP_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://doupu:doupu-ci-password@127.0.0.1:5432/doupu
          POSTGRES_PASSWORD: doupu-ci-password
          SITE_DOMAIN: localhost
          COS_SECRET_ID: ci
          COS_SECRET_KEY: ci
          COS_BUCKET: ci
          COS_REGION: ap-guangzhou
          BACKUP_ALERT_TOKEN: ci
          ADMIN_EMAIL: ops@example.test
          ANALYTICS_IP_HMAC_KEY: ci-analytics-ip-hmac-key-32-characters
      - name: Native Argon2 smoke
        run: docker run --rm doupu-app:local node -e "require('argon2').hash('ci-password').then(()=>process.exit(0)).catch(()=>process.exit(1))"
      - name: Final-image strict-v3 preflight and PostgreSQL migration contract
        run: npm run test:protocol-preflight
        env:
          DATABASE_URL: postgresql://doupu:doupu-ci-password@127.0.0.1:5432/doupu
          PROTOCOL_PREFLIGHT_IMAGE: doupu-app:local
      - name: PostgreSQL revision and quota contract
        run: npm run test:postgres-contract
        env:
          DATABASE_URL: postgresql://doupu:doupu-ci-password@127.0.0.1:5432/doupu
      - name: Standalone production startup, PostgreSQL route contract and browser smoke
        run: |
          docker run -d --name doupu-standalone-ci --network host \
            -e HOSTNAME=0.0.0.0 \
            -e APP_URL=https://example.test -e DATABASE_URL="$DATABASE_URL" \
            -e SMTP_HOST=mail.example.test -e SMTP_USER=ci -e SMTP_PASS=ci -e SMTP_FROM=ci@example.test \
            -e BACKUP_ALERT_TOKEN=ci-backup-alert-token-32-characters -e ADMIN_EMAIL=ops@example.test \
            -e ANALYTICS_IP_HMAC_KEY=ci-analytics-ip-hmac-key-32-characters \
            -e COS_BUCKET=ci -e COS_SECRET_ID=ci -e COS_SECRET_KEY=ci -e COS_REGION=ap-guangzhou \
            doupu-app:local
          # 这一步的日志要仓库 admin 才能看（anonymous/普通用户都拿不到
          # /actions/jobs/{id}/logs 与网页日志），所以把现场落盘 + 作为 artifact 上传：
          # artifact 是公开可读的，不看网页日志也能定位到底失败在哪一段。
          # 不撤销的 EXIT trap：无论哪一段失败都先抓 300 行容器日志与容器状态。
          mkdir -p .artifacts
          set -e
          trap 'docker logs --tail 300 doupu-standalone-ci > .artifacts/standalone-container.log 2>&1 || true; docker inspect -f "container status: {{.State.Status}} exit={{.State.ExitCode}}" doupu-standalone-ci > .artifacts/standalone-container-status.txt 2>&1 || true' EXIT
          healthy=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then healthy=true; break; fi
            # 容器已经退出就别再空转 60 秒：fail-fast 让日志更快出现在输出里。
            if [ "$(docker inspect -f '{{.State.Running}}' doupu-standalone-ci 2>/dev/null)" = "false" ]; then break; fi
            sleep 2
          done
          if [ "$healthy" != true ]; then echo "stage=health-check"; exit 31; fi
          # `--` 不是装饰：随机 token 有 1/64 的概率以「-」开头（base64url），
          # 此时 node 会把位置参数当成选项解析并以 `bad option` 退出 9（曾整步红灯）。
          SESSION_TOKEN=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")
          VERIFY_TOKEN=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")
          ADMIN_TOKEN=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")
          SESSION_HASH=$(node -e "process.stdout.write(require('node:crypto').createHash('sha256').update(process.argv[1]).digest('hex'))" -- "$SESSION_TOKEN")
          VERIFY_HASH=$(node -e "process.stdout.write(require('node:crypto').createHash('sha256').update(process.argv[1]).digest('hex'))" -- "$VERIFY_TOKEN")
          ADMIN_HASH=$(node -e "process.stdout.write(require('node:crypto').createHash('sha256').update(process.argv[1]).digest('hex'))" -- "$ADMIN_TOKEN")
          docker exec ${{ job.services.postgres.id }} psql -U doupu -d doupu -v ON_ERROR_STOP=1 -c "
            INSERT INTO users(id,email,password_hash,email_verified_at) VALUES
              ('00000000-0000-4000-8000-000000000101','production-contract@example.test','not-used',now()),
              ('00000000-0000-4000-8000-000000000102','production-token@example.test','not-used',NULL);
            INSERT INTO users(id,email,password_hash,email_verified_at,role) VALUES
              ('00000000-0000-4000-8000-000000000103','production-admin@example.test','not-used',now(),'admin');
            INSERT INTO sessions(user_id,token_hash,expires_at,absolute_expires_at)
              VALUES ('00000000-0000-4000-8000-000000000101','$SESSION_HASH',now()+interval '30 days',now()+interval '90 days');
            INSERT INTO sessions(user_id,token_hash,expires_at,absolute_expires_at)
              VALUES ('00000000-0000-4000-8000-000000000103','$ADMIN_HASH',now()+interval '14 days',now()+interval '74 days');
            INSERT INTO email_tokens(user_id,purpose,token_hash,expires_at)
              VALUES ('00000000-0000-4000-8000-000000000102','verify','$VERIFY_HASH',now()+interval '1 day');"
          set +e
          E2E_BASE_URL=http://127.0.0.1:3000 E2E_SESSION_TOKEN="$SESSION_TOKEN" node tests/postgres/route-contract.cjs
          route=$?
          E2E_BASE_URL=http://127.0.0.1:3000 E2E_SESSION_TOKEN="$SESSION_TOKEN" E2E_VERIFY_TOKEN="$VERIFY_TOKEN" E2E_ADMIN_SESSION_TOKEN="$ADMIN_TOKEN" npm run test:e2e:production
          smoke=$?
          set -e
          # 退出码编码「失败在哪一段」：31=容器没起来 / 32=route-contract / 33=浏览器冒烟。
          # check-run 的 annotation 是公开可读的，于是不看日志也能定位。
          {
            echo "route-contract exit=$route"
            echo "browser-smoke exit=$smoke"
          } > .artifacts/standalone-stage.txt
          cat .artifacts/standalone-stage.txt
          if [ "$route" != 0 ]; then docker rm -f doupu-standalone-ci >/dev/null 2>&1; exit 32; fi
          if [ "$smoke" != 0 ]; then docker rm -f doupu-standalone-ci >/dev/null 2>&1; exit 33; fi
          docker rm -f doupu-standalone-ci
          trap - EXIT
        env:
          DATABASE_URL: postgresql://doupu:doupu-ci-password@127.0.0.1:5432/doupu
      - name: Upload standalone smoke diagnostics
        # 公开 artifact：这一步的日志本身要 admin 才能看，artifact 不用，便于任何人复查。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-smoke-diagnostics
          path: |
            .artifacts/standalone-stage.txt
            .artifacts/standalone-container.log
            .artifacts/standalone-container-status.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Verified backup and restore drill
        run: |
          mkdir -p .backup-smoke
          docker exec ${{ job.services.postgres.id }} psql -U doupu -d doupu -c "CREATE TABLE release_backup_canary(value text NOT NULL); INSERT INTO release_backup_canary VALUES ('verified');"
          docker run --rm --network host --entrypoint sh \
            -e PGHOST=127.0.0.1 -e PGUSER=doupu -e PGPASSWORD=doupu-ci-password -e PGDATABASE=doupu \
            -e BACKUP_DESTINATION=/backup/doupu-backup \
            -v "$PWD/.backup-smoke:/backup" -v "$PWD/deploy/scripts:/scripts:ro" \
            doupu-backup:local /scripts/backup.sh
          # 归档落在 .backup-smoke/doupu-backup/ 下；恢复容器挂载 .backup-smoke 为 /backup，
          # 因此要把相对路径原样带进去（此前用 ##*/ 只剩文件名，容器里找不到归档）。
          archive=$(find .backup-smoke -name 'doupu-*.dump.gz' -type f -print -quit)
          test -n "${archive}" || { echo "backup archive not found under .backup-smoke" >&2; exit 1; }
          docker run --rm --network host --entrypoint sh \
            -e PGHOST=127.0.0.1 -e PGUSER=doupu -e PGPASSWORD=doupu-ci-password -e PGDATABASE=postgres \
            -e RESTORE_DATABASE=doupu_restore_test \
            -e "RESTORE_CANARY_SQL=SELECT value FROM release_backup_canary WHERE value='verified'" \
            -v "$PWD/.backup-smoke:/backup:ro" -v "$PWD/deploy/scripts:/scripts:ro" \
            doupu-backup:local /scripts/restore-drill.sh "/backup/${archive#.backup-smoke/}"
