name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint / typecheck / unit / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 / undici 8 要求 Node >= 22（node 20 下 webidl.util.markAsUncloneable 缺失，
          # jsdom 测试 worker 无法启动）；生产镜像仍为 node:20-alpine，不受影响
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests + coverage（护栏见 vitest.config.mts thresholds）
        run: npm run test:coverage
      - name: Build
        run: npm run build

  e2e:
    name: E2E（chromium / firefox / webkit）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
